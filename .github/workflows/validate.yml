name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository and run the full test suite
        run: python scripts/run_all_tests.py

      - name: Test Agent Skills installer
        run: python scripts/install_skills.py --client agents --target ./tmp/agents-skills --force

      - name: Test Codex installer
        run: python scripts/install_skills.py --client codex --target ./tmp/codex-skills --force

      - name: Test Claude installer
        run: python scripts/install_skills.py --client claude --target ./tmp/claude-skills --force
